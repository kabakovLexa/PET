version: '3.8'

services:
  # Test Database
  postgres-test:
    image: postgres:15
    container_name: postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: microservices_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    volumes:
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - test-network

  # Test Kafka
  zookeeper-test:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-test
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - test-network

  kafka-test:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-test
    depends_on:
      - zookeeper-test
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-test:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - test-network

  # Test Services
  discovery-service-test:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: discovery-service-test
    ports:
      - "8762:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=test
    networks:
      - test-network

  api-gateway-test:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-test
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service-test:8761/eureka
    depends_on:
      - discovery-service-test
    networks:
      - test-network

  user-service-test:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service-test
    ports:
      - "8084:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service-test:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-test:5432/user_db
      - SPRING_DATASOURCE_USERNAME=test_user
      - SPRING_DATASOURCE_PASSWORD=test_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka-test:9092
    depends_on:
      - discovery-service-test
      - postgres-test
      - kafka-test
    networks:
      - test-network

  product-service-test:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service-test
    ports:
      - "8086:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service-test:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-test:5432/product_db
      - SPRING_DATASOURCE_USERNAME=test_user
      - SPRING_DATASOURCE_PASSWORD=test_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka-test:9092
    depends_on:
      - discovery-service-test
      - postgres-test
      - kafka-test
    networks:
      - test-network

networks:
  test-network:
    driver: bridge