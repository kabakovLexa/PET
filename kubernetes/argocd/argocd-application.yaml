      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-production
  namespace: argocd
  labels:
    name: microservices-production
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/microservices-project.git
    targetRevision: main
    path: helm/microservices
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Production deployments require manual sync
    # automated:
    #   prune: false
    #   selfHeal: false