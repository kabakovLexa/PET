# Default values for microservices
global:
  imageRegistry: ""
  imageTag: "latest"
  imagePullPolicy: IfNotPresent
  storageClass: ""
  
# Microservices configuration
microservices:
  discoveryService:
    enabled: true
    name: discovery-service
    replicaCount: 2
    image:
      repository: discovery-service
      tag: ""
    service:
      type: ClusterIP
      port: 8761
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m

  apiGateway:
    enabled: true
    name: api-gateway
    replicaCount: 3
    image:
      repository: api-gateway
      tag: ""
    service:
      type: LoadBalancer
      port: 8080
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m

  userService:
    enabled: true
    name: user-service
    replicaCount: 2
    image:
      repository: user-service
      tag: ""
    service:
      type: ClusterIP
      port: 8081
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m

  productService:
    enabled: true
    name: product-service
    replicaCount: 2
    image:
      repository: product-service
      tag: ""
    service:
      type: ClusterIP
      port: 8082
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m

# PostgreSQL configuration (Bitnami chart)
postgresql:
  enabled: true
  auth:
    postgresPassword: postgres123
    database: microservices_db
  primary:
    initdb:
      scripts:
        init-databases.sql: |
          CREATE DATABASE user_db;
          CREATE DATABASE product_db;
          GRANT ALL PRIVILEGES ON DATABASE user_db TO postgres;
          GRANT ALL PRIVILEGES ON DATABASE product_db TO postgres;
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
  persistence:
    enabled: true
    size: 2Gi

# Kafka configuration (Bitnami chart)
kafka:
  enabled: true
  replicaCount: 1
  auth:
    enabled: false
  zookeeper:
    enabled: true
    replicaCount: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 1
  persistence:
    enabled: true
    size: 2Gi

# Monitoring stack
monitoring:
  prometheus:
    enabled: true
    server:
      resources:
        requests:
          memory: 256Mi
          cpu: 250m
        limits:
          memory: 512Mi
          cpu: 500m
      persistentVolume:
        enabled: true
        size: 2Gi

  grafana:
    enabled: true
    adminPassword: admin123
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    persistence:
      enabled: true
      size: 1Gi
    dashboards:
      default:
        microservices-overview:
          url: https://raw.githubusercontent.com/your-org/microservices/main/monitoring/grafana/dashboards/microservices-overview.json

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: microservices.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: api-gateway
            port: 8080
    - host: monitoring.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: grafana
            port: 3000
  tls: []

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  fsGroup: 2000

# Security Context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80