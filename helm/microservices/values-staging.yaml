# Staging environment values
global:
  imageRegistry: ""
  imageTag: "develop"
  imagePullPolicy: Always

# Staging specific configuration
microservices:
  discoveryService:
    replicaCount: 1
  apiGateway:
    replicaCount: 2
    service:
      type: ClusterIP  # Use ingress for staging
  userService:
    replicaCount: 1
  productService:
    replicaCount: 1

# Reduced resources for staging
postgresql:
  primary:
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m

kafka:
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 400m

# Staging ingress
ingress:
  enabled: true
  hosts:
    - host: staging.microservices.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: api-gateway
            port: 8080

# Enable autoscaling for staging
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70