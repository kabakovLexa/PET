apiVersion: v2
name: microservices
description: A Helm chart for Java Microservices architecture
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - microservices
  - spring-boot
  - kafka
  - postgresql
  - java

maintainers:
  - name: DevOps Team
    email: devops@microservices.local

dependencies:
  - name: postgresql
    version: "^12.1.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: kafka
    version: "^20.0.0" 
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
  - name: prometheus
    version: "^15.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "^6.50.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.grafana.enabled