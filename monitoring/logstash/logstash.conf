input {
  beats {
    port => 5044
  }
  
  # TCP input for direct logging from microservices
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse Spring Boot logs
  if [fields][service] {
    mutate {
      add_field => { "service_name" => "%{[fields][service]}" }
    }
  }

  # Parse log level and message
  if [message] {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{NUMBER:pid} --- \[%{DATA:service}\] \[%{DATA:thread}\] %{DATA:logger} : %{GREEDYDATA:log_message}"
      }
    }
  }

  # Add timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    }
  }

  # Tag different services
  if [service_name] == "user-service" {
    mutate {
      add_tag => ["user-service"]
    }
  } else if [service_name] == "product-service" {
    mutate {
      add_tag => ["product-service"]
    }
  } else if [service_name] == "api-gateway" {
    mutate {
      add_tag => ["api-gateway"]
    }
  } else if [service_name] == "discovery-service" {
    mutate {
      add_tag => ["discovery-service"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug output
  stdout {
    codec => rubydebug
  }
}